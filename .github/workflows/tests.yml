name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Les tests n'appellent aucune API et n'utilisent aucune donnée réelle (base temporaire).
      - run: python -m pytest tests/ -q
        env:
          EXTRACTION_BACKEND: ollama
